# 랜딩 페이지를 GitHub Pages 로 배포한다.
#
# App Store 제출에는 열려 있는 지원 URL 과 개인정보 처리방침 URL 이 반드시 필요하다.
# 랜딩·지원·처리방침을 한 곳에 두면 주소가 하나로 정리되고, 마케팅 URL 도 같이 생긴다.
#
# 앱(SPA)은 여기 올리지 않는다. Supabase 키를 빌드 시점에 넣어야 하고 배포 주기도
# 다르다 — 랜딩은 정적 파일 몇 개뿐이라 따로 두는 편이 단순하다.
name: Deploy landing to Pages

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 나중 것만 남긴다. 중간에 끊지는 않는다 — 반쯤 올라간 상태로 두지 않으려고.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing
      - id: deployment
        uses: actions/deploy-pages@v4
